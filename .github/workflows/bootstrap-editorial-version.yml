name: Bootstrap v0.10.9 npm version (temporary)

on:
  push:
    branches: [feat/0.10.9-editorial-literal-evidence-gate]

permissions:
  contents: write

jobs:
  bump:
    if: github.repository == 'KeyserDSoze/BookWriter' && github.ref == 'refs/heads/feat/0.10.9-editorial-literal-evidence-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update version and lock using real npm
        working-directory: src/frontend
        run: |
          npm pkg set version=0.10.9
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          assert.equal(pkg.version,'0.10.9');
          assert.equal(lock.version,pkg.version);
          assert.equal(lock.packages[''].version,pkg.version);
          assert.deepEqual(lock.packages[''].dependencies,pkg.dependencies);
          assert.deepEqual(lock.packages[''].devDependencies,pkg.devDependencies);
          NODE
      - name: Reinstall with the updated lockfile
        working-directory: src/frontend
        run: npm ci --no-audit --no-fund
      - name: TypeScript, unit, smoke and build before commit
        working-directory: src/frontend
        run: |
          npm run typecheck
          npm run test
          npm run smoke
          npm run build
      - name: Commit only manifest and lock generated by npm
        run: |
          set -euo pipefail
          git add src/frontend/package.json src/frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Nessuna versione da aggiornare"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(release): bump to v0.10.9 using npm-generated lock'
          git push origin HEAD:refs/heads/feat/0.10.9-editorial-literal-evidence-gate
