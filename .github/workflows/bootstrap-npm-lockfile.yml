name: Bootstrap npm lockfile (temporary release preparation)

# Short-lived and isolated: only create a real npm lockfile in this exact topic branch.
on:
  push:
    branches:
      - feat/0.10.8-verified-npm-lockfile

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'KeyserDSoze/BookWriter' && github.ref == 'refs/heads/feat/0.10.8-verified-npm-lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from the real npm registry
        working-directory: src/frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify the lockfile root against the manifest
        working-directory: src/frontend
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          assert.equal(lock.lockfileVersion,3);
          assert.equal(lock.name,manifest.name);
          assert.equal(lock.version,manifest.version);
          assert.deepEqual(lock.packages[''].dependencies,manifest.dependencies);
          assert.deepEqual(lock.packages[''].devDependencies,manifest.devDependencies);
          for(const name of ['tailwindcss','@tailwindcss/vite']){
            assert.equal(lock.packages['node_modules/'+name].version,'4.3.4');
          }
          console.log('Lockfile generato da npm, versione e dipendenze dirette coerenti');
          NODE
      - name: First clean reproducible install
        working-directory: src/frontend
        run: npm ci --no-audit --no-fund
      - name: Second clean reproducible install
        working-directory: src/frontend
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund
      - name: Typecheck, unit tests, smoke, build
        working-directory: src/frontend
        run: |
          npm run typecheck
          npm run test
          npm run smoke
          npm run build
      - name: Ensure manifest untouched
        run: git diff --exit-code -- src/frontend/package.json
      - name: Commit npm-generated lockfile to isolated topic branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/0.10.8-verified-npm-lockfile'
          test -s src/frontend/package-lock.json
          git add src/frontend/package-lock.json
          git diff --cached --quiet && { echo 'No lockfile changes'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(npm): generate verified package-lock.json with npm 10'
          git push origin HEAD:refs/heads/feat/0.10.8-verified-npm-lockfile
