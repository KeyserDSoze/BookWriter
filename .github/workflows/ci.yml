name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify npm lock unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Smoke tests
        run: npm run smoke
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end browser tests (desktop + mobile)
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report
          if-no-files-found: ignore

  # The official W3C validator runs against an EPUB generated by buildEpub,
  # not a curated or prebuilt test asset. It is an independent required CI job.
  epubcheck:
    name: EPUBCheck 5.4.0 (canone sintetico)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate real EPUB fixture with buildEpub
        env:
          EPUBCHECK_OUTPUT: ${{ runner.temp }}/bookwriter-canon.epub
        run: |
          npx --no-install vitest run src/infrastructure/epubcheck-fixture.test.ts
          test -s "$EPUBCHECK_OUTPUT"
      - name: Download and verify official W3C EPUBCheck 5.4.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/epubcheck-5.4.0.zip"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip" \
            --output "$archive"
          # SHA-256 from the asset's digest in the official GitHub Release API.
          echo "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/epubcheck"
          unzip -q "$archive" -d "$RUNNER_TEMP/epubcheck"
          jar="$(find "$RUNNER_TEMP/epubcheck" -type f -name epubcheck.jar -print -quit)"
          test -n "$jar"
          java -jar "$jar" --version
          # Non-zero exit is blocking: never ignore EPUBCheck errors.
          java -jar "$jar" "$RUNNER_TEMP/bookwriter-canon.epub"
