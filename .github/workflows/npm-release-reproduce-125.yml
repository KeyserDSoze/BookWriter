name: Reproduce npm release 0.11.82 for issue 125

# One-shot, read-only npm provenance for the direct-main release.
# Remove this workflow in the exact release commit after verifying the output.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/npm-release-reproduce-125.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate manifest and lock with npm 10 and official registry
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(node -p "require('./package.json').version")" = "0.11.81"
          test "$(npm --version | cut -d. -f1)" = "10"
          npm version 0.11.82 --no-git-tag-version --ignore-scripts
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const {execFileSync} = require("node:child_process");
          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const original = JSON.parse(execFileSync("git",
            ["show", "HEAD:src/frontend/package-lock.json"], {encoding: "utf8"}));
          assert.equal(manifest.version, "0.11.82");
          assert.equal(lock.version, manifest.version);
          assert.equal(lock.packages[""].version, manifest.version);
          assert.equal(lock.lockfileVersion, 3);
          assert.deepEqual(lock.packages[""].dependencies, manifest.dependencies);
          assert.deepEqual(lock.packages[""].devDependencies, manifest.devDependencies);
          assert.deepEqual(Object.keys(lock.packages), Object.keys(original.packages));
          for (const [id, pkg] of Object.entries(original.packages)) {
            if (id === "") continue;
            assert.deepEqual(lock.packages[id], pkg, "Unexpected dependency drift: " + id);
            if (pkg.resolved) {
              assert.ok(pkg.resolved.startsWith("https://"));
              if (pkg.resolved.startsWith("https://registry.npmjs.org/"))
                assert.match(pkg.integrity ?? "", /^sha(?:512|384|256|1)-[A-Za-z0-9+/=]+$/);
            }
          }
          console.log("BOOKWRITER125|VERIFIED|registry=official;locktree=unchanged;version=0.11.82");
          NODE
          git diff --stat -- package.json package-lock.json
          git diff -- package.json package-lock.json | head -n 90
      - name: Prepare only the release heading for local smoke verification
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const p = "../../docs/CHANGELOG.md";
          let text = fs.readFileSync(p, "utf8");
          const from = "## Non rilasciato — issue #124 (epic #6/#17/#20)";
          const second = "## Non rilasciato — issue #123 (epic #6/#17/#20)";
          if (text.split(from).length !== 2 || text.split(second).length !== 2)
            throw Error("Unexpected pending release sections");
          text = text.replace(from, "## 0.11.82 — 2026-11-11 (main, issues #123/#124)\\n\\n### Timeout degli header AI — #124");
          text = text.replace(second, "### Lettura limitata delle risposte AI — #123");
          // Replace escaped line markers in the literal heading conversion.
          text = text.replace("issues #123/#124)\\n\\n###", "issues #123/#124)\n\n###");
          fs.writeFileSync(p, text);
          NODE
      - name: Clean install and checks round one
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          npm run typecheck
          npm run test
          npm run smoke
          npm run build
      - name: Clean install and checks round two
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          npm run typecheck
          npm run test
          npm run smoke
          npm run build
      - name: Emit exact npm-generated files with indexed chunks and digests
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          for (const file of ["package.json", "package-lock.json"]) {
            const raw = fs.readFileSync(file, "utf8");
            const size = 3000;
            const count = Math.ceil(raw.length / size);
            const digest = crypto.createHash("sha256").update(raw).digest("hex");
            console.log("BOOKWRITER125|META|" + file + "|" + raw.length + "|" + count + "|" + digest);
            for (let i = 0; i < count; ++i) {
              console.log("BOOKWRITER125|DATA|" + file + "|" + i + "|" + JSON.stringify(raw.slice(i * size, (i + 1) * size)));
            }
          }
          NODE
