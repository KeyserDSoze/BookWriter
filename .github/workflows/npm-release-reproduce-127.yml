name: Reproduce npm release 0.11.83 for issue 127

# Temporary read-only provenance runner. Deleted atomically in release commit.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/npm-release-reproduce-127.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Produce official npm manifest and lockfile
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(node -p "require('./package.json').version")" = "0.11.82"
          test "$(npm --version | cut -d. -f1)" = "10"
          npm version 0.11.83 --no-git-tag-version --ignore-scripts
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const {execFileSync} = require("node:child_process");
          const pkg = JSON.parse(fs.readFileSync("package.json","utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json","utf8"));
          const before = JSON.parse(execFileSync("git", ["show","HEAD:src/frontend/package-lock.json"],{encoding:"utf8"}));
          assert.equal(pkg.version, "0.11.83");
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[""].version, pkg.version);
          assert.equal(lock.name, pkg.name);
          assert.equal(lock.packages[""].name, pkg.name);
          assert.equal(lock.lockfileVersion, 3);
          assert.deepEqual(lock.packages[""].dependencies, pkg.dependencies);
          assert.deepEqual(lock.packages[""].devDependencies, pkg.devDependencies);
          assert.deepEqual(Object.keys(lock.packages), Object.keys(before.packages));
          for (const [id, entry] of Object.entries(before.packages)) {
            if (id === "") continue;
            assert.deepEqual(lock.packages[id], entry, "Unexpected dependency changes: " + id);
            if (!entry.resolved) continue;
            const u = new URL(entry.resolved);
            assert.equal(u.protocol,"https:");
            if (u.hostname === "registry.npmjs.org")
              assert.match(entry.integrity ?? "", /^sha(?:512|384|256|1)-[A-Za-z0-9+/=]+$/);
          }
          console.log("BOOKWRITER127|VERIFIED|version=0.11.83;tree=unchanged;registry=official;packages=" + Object.keys(lock.packages).length);
          NODE
          git diff --stat -- package.json package-lock.json
          git diff -- package.json package-lock.json | head -n 60
      - name: Prepare exact release changelog for smoke checks
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const path="../../docs/CHANGELOG.md";
          let s=fs.readFileSync(path,"utf8");
          const before="## Non rilasciato — issue #126 (epic #17)";
          if (s.split(before).length !== 2) throw Error("Unexpected changelog: missing single #126 header");
          s=s.replace(before,"## 0.11.83 — 2026-11-11 (main, issue #126)");
          fs.writeFileSync(path,s);
          NODE
      - name: Clean install and checks round 1
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          git diff --exit-code -- package-lock.json
          npm run typecheck
          npm run test
          npm run smoke
          npm run build
      - name: Clean install and checks round 2
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          git diff --exit-code -- package-lock.json
          npm run typecheck
          npm run test
          npm run smoke
          npm run build
      - name: Emit npm-produced exact files in indexed audited chunks
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("node:fs");
          const crypto=require("node:crypto");
          for (const path of ["package.json","package-lock.json"]) {
            const data=fs.readFileSync(path,"utf8");
            const size=3000;
            const chunks=Math.ceil(data.length/size);
            const sha=crypto.createHash("sha256").update(data).digest("hex");
            console.log("BOOKWRITER127|META|"+path+"|"+data.length+"|"+chunks+"|"+sha);
            for (let n=0;n<chunks;n++)
              console.log("BOOKWRITER127|DATA|"+path+"|"+n+"|"+JSON.stringify(data.slice(n*size,(n+1)*size)));
          }
          NODE
