name: Reproduce npm release 0.11.85 for issue 131

# Read-only one-shot npm provenance runner, removed in the final release commit.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/npm-release-reproduce-131.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce official npm manifest and lockfile
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(node -p "require('./package.json').version")" = "0.11.84"
          test "$(npm --version | cut -d. -f1)" = "10"
          npm version 0.11.85 --no-git-tag-version --ignore-scripts
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node - <<'NODE'
          const assert=require("node:assert/strict");
          const fs=require("node:fs");
          const {execFileSync}=require("node:child_process");
          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
          const before=JSON.parse(execFileSync("git",["show","HEAD:src/frontend/package-lock.json"],{encoding:"utf8"}));
          assert.equal(pkg.version,"0.11.85");
          assert.equal(lock.version,"0.11.85");
          assert.equal(lock.packages[""].version,"0.11.85");
          assert.equal(lock.name,pkg.name);
          assert.equal(lock.packages[""].name,pkg.name);
          assert.equal(lock.lockfileVersion,3);
          assert.deepEqual(lock.packages[""].dependencies,pkg.dependencies);
          assert.deepEqual(lock.packages[""].devDependencies,pkg.devDependencies);
          assert.deepEqual(Object.keys(lock.packages),Object.keys(before.packages));
          for(const [id,entry] of Object.entries(before.packages)){
            if(id==="")continue;
            assert.deepEqual(lock.packages[id],entry,"Unexpected transitive dependency change: "+id);
            if(!entry.resolved)continue;
            const url=new URL(entry.resolved);
            assert.equal(url.protocol,"https:","Insecure resolved URL "+id);
            if(url.hostname==="registry.npmjs.org")
              assert.match(entry.integrity??"",/^sha(?:512|384|256|1)-[A-Za-z0-9+/=]+$/,id);
          }
          console.log("BOOKWRITER131|VERIFIED|version=0.11.85;tree=unchanged;registry=official;packages="+Object.keys(lock.packages).length);
          NODE
          sha256sum package-lock.json > "$RUNNER_TEMP/npm131-lock.sha256"
          git diff --stat -- package.json package-lock.json
          git diff -- package.json package-lock.json | head -n 60
      - name: Prepare matching changelog for release smoke
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("node:fs");
          const path="../../docs/CHANGELOG.md";
          let s=fs.readFileSync(path,"utf8");
          const anchor="## Non rilasciato — issue #130 (epic #17/#6)";
          if(s.split(anchor).length!==2)throw Error("Unexpected changelog header");
          s=s.replace(anchor,"## 0.11.85 — 2026-11-11 (main, issue #130, epic #17/#6)");
          fs.writeFileSync(path,s);
          NODE
      - name: Clean npm ci and full checks round 1
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          sha256sum --check "$RUNNER_TEMP/npm131-lock.sha256"
          npm run typecheck
          npm run test
          npm run smoke
          npm run build
      - name: Clean npm ci and full checks round 2
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          sha256sum --check "$RUNNER_TEMP/npm131-lock.sha256"
          npm run typecheck
          npm run test
          npm run smoke
          npm run build
      - name: Emit exact npm-produced files in indexed audited chunks
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("node:fs");
          const crypto=require("node:crypto");
          for(const path of ["package.json","package-lock.json"]){
            const data=fs.readFileSync(path,"utf8");
            const size=3000;
            const count=Math.ceil(data.length/size);
            const sha=crypto.createHash("sha256").update(data).digest("hex");
            console.log("BOOKWRITER131|META|"+path+"|"+data.length+"|"+count+"|"+sha);
            for(let i=0;i<count;i++)
              console.log("BOOKWRITER131|DATA|"+path+"|"+i+"|"+JSON.stringify(data.slice(i*size,(i+1)*size)));
          }
          NODE
