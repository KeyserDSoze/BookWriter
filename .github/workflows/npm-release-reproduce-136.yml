name: Reproduce npm release 0.11.87 for issue 136

# One-shot read-only npm provenance runner, removed in final release commit.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/npm-release-reproduce-136.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm manifest and lockfile with official registry
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(node -p "require('./package.json').version")" = "0.11.86"
          test "$(npm --version | cut -d. -f1)" = "10"
          npm version 0.11.87 --no-git-tag-version --ignore-scripts
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const {execFileSync} = require("node:child_process");
          const pkg = JSON.parse(fs.readFileSync("package.json","utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json","utf8"));
          const prior = JSON.parse(execFileSync("git",["show","HEAD:src/frontend/package-lock.json"],{encoding:"utf8"}));
          assert.equal(pkg.version,"0.11.87");
          assert.equal(lock.version,"0.11.87");
          assert.equal(lock.packages[""].version,"0.11.87");
          assert.equal(lock.name,pkg.name);
          assert.equal(lock.packages[""].name,pkg.name);
          assert.equal(lock.lockfileVersion,3);
          assert.deepEqual(lock.packages[""].dependencies,pkg.dependencies);
          assert.deepEqual(lock.packages[""].devDependencies,pkg.devDependencies);
          assert.deepEqual(Object.keys(lock.packages),Object.keys(prior.packages));
          for(const [id,entry] of Object.entries(prior.packages)){
            if(id==="")continue;
            assert.deepEqual(lock.packages[id],entry,"Unexpected transitive dependency drift: "+id);
            if(!entry.resolved)continue;
            const url=new URL(entry.resolved);
            assert.equal(url.protocol,"https:","Insecure resolved URL: "+id);
            if(url.hostname==="registry.npmjs.org")
              assert.match(entry.integrity??"",/^sha(?:512|384|256|1)-[A-Za-z0-9+/=]+$/,id);
          }
          console.log("BOOKWRITER136|VERIFIED|version=0.11.87;tree=unchanged;registry=official;packages="+Object.keys(lock.packages).length);
          NODE
          sha256sum package.json > "$RUNNER_TEMP/npm136-package.sha256"
          sha256sum package-lock.json > "$RUNNER_TEMP/npm136-lock.sha256"
          git diff --stat -- package.json package-lock.json
          git diff -- package.json package-lock.json | head -n 60
      - name: Prepare matching release changelog for smoke
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("node:fs");
          const path="../../docs/CHANGELOG.md";
          let s=fs.readFileSync(path,"utf8");
          const anchor="## Non rilasciato — issue #135 (epic #17/#6)";
          if(s.split(anchor).length!==2)throw Error("Unexpected changelog anchor");
          s=s.replace(anchor,"## 0.11.87 — 2026-11-11 (main, issue #135, epic #17/#6)");
          fs.writeFileSync(path,s);
          NODE
      - name: Fresh npm ci plus typecheck tests smoke build round 1
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          sha256sum --check "$RUNNER_TEMP/npm136-package.sha256"
          sha256sum --check "$RUNNER_TEMP/npm136-lock.sha256"
          npm run typecheck
          npm run test
          npm run smoke
          npm run build
      - name: Fresh npm ci plus typecheck tests smoke build round 2
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          sha256sum --check "$RUNNER_TEMP/npm136-package.sha256"
          sha256sum --check "$RUNNER_TEMP/npm136-lock.sha256"
          npm run typecheck
          npm run test
          npm run smoke
          npm run build
      - name: Assert both generated files unchanged after two clean installs
        run: |
          sha256sum --check "$RUNNER_TEMP/npm136-package.sha256"
          sha256sum --check "$RUNNER_TEMP/npm136-lock.sha256"
      - name: Emit exact npm-generated package files as indexed hashed chunks
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("node:fs");
          const crypto=require("node:crypto");
          for(const file of ["package.json","package-lock.json"]){
            const data=fs.readFileSync(file,"utf8");
            const size=3000;
            const count=Math.ceil(data.length/size);
            const digest=crypto.createHash("sha256").update(data).digest("hex");
            console.log("BOOKWRITER136|META|"+file+"|"+data.length+"|"+count+"|"+digest);
            for(let index=0;index<count;index++)
              console.log("BOOKWRITER136|DATA|"+file+"|"+index+"|"+JSON.stringify(data.slice(index*size,(index+1)*size)));
          }
          NODE
      - name: Upload exact npm release files for provenance
        uses: actions/upload-artifact@v4
        with:
          name: bookwriter-npm-0.11.87-generated
          path: |
            src/frontend/package.json
            src/frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
