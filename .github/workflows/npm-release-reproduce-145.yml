name: Reproduce npm release 0.11.90 (read-only, temporary)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Assert npm 10 and base release
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm --version | grep -Eq '^10\.'
          node -e 'const p=require("./package.json"); const l=require("./package-lock.json"); if(p.version!=="0.11.89"||l.version!=="0.11.89"||l.packages[""].version!=="0.11.89") process.exit(1)'
      - name: Regenerate release files using official npm
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.11.90 --no-git-tag-version --ignore-scripts
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const {execFileSync} = require("node:child_process");
          const current = JSON.parse(fs.readFileSync("package-lock.json","utf8"));
          const previous = JSON.parse(execFileSync("git",["show","HEAD:src/frontend/package-lock.json"],{encoding:"utf8"}));
          const manifest = JSON.parse(fs.readFileSync("package.json","utf8"));
          assert.equal(manifest.version,"0.11.90");
          assert.equal(current.version,"0.11.90");
          assert.equal(current.packages[""].version,"0.11.90");
          assert.equal(current.lockfileVersion,3);
          assert.equal(Object.keys(current.packages).length,235);
          previous.version="0.11.90";
          previous.packages[""].version="0.11.90";
          assert.deepEqual(current,previous,"No dependency, resolved URL or integrity changes allowed");
          console.log("LOCKFILE_DEPENDENCIES_UNCHANGED 235");
          NODE
          sha256sum package.json package-lock.json
          sha256sum package-lock.json > "$RUNNER_TEMP/bookwriter-release-lock.sha256"
      - name: First clean npm ci and all non-browser gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          sha256sum -c "$RUNNER_TEMP/bookwriter-release-lock.sha256"
          npm run typecheck
          npm run test
          npm run smoke
          npm run build
      - name: Second clean npm ci and all non-browser gates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          sha256sum -c "$RUNNER_TEMP/bookwriter-release-lock.sha256"
          npm run typecheck
          npm run test
          npm run smoke
          npm run build
      - name: Emit exact npm-generated bytes for atomic release commit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          for(const [name,file] of [["manifest","package.json"],["lock","package-lock.json"]]){
            const source = fs.readFileSync(file);
            const value = source.toString("utf8");
            const pieces = value.match(/[\s\S]{1,1800}/g) ?? [];
            const sha = crypto.createHash("sha256").update(source).digest("hex");
            console.log(`BOOKWRITER_145|${name}|BEGIN|${pieces.length}|${source.length}|${sha}`);
            for(let i=0;i<pieces.length;i++)
              console.log(`BOOKWRITER_145|${name}|${i}|${JSON.stringify(pieces[i])}`);
            console.log(`BOOKWRITER_145|${name}|END`);
          }
          NODE
      - name: Upload original npm-generated files
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-0-11-90-original
          path: |
            src/frontend/package.json
            src/frontend/package-lock.json
          if-no-files-found: error
